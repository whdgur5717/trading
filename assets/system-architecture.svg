<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">그때 샀다면 시스템 구성도</title>
  <desc id="desc">사용자 요청이 Cloudflare Workers의 Next.js 프론트엔드에서 Access와 Tunnel을 거쳐 AWS EC2의 NestJS 백엔드로 전달되고, 백엔드는 외부 금융 데이터 API 및 WebSocket과 통신하며 CloudWatch로 관측 데이터를 보내는 구조</desc>

