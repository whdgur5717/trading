overlay: 1.1.0
info:
  title: OpenDART REST mock examples
  version: 1.0.0
extends: ./openapi.json
actions:
  - target: $.paths['/api/company.json'].get.responses['200'].content['application/json']
    update:
      examples:
        success:
          value:
            status: "000"
            message: 정상
            corp_code: "00126380"
            corp_name: 삼성전자
            stock_code: "005930"
            stock_name: 삼성전자
            corp_cls: Y
            induty_code: "264"
            est_dt: "19690113"
            acc_mt: "12"
        error/no-data:
          value:
            status: "013"
            message: 조회된 데이타가 없습니다.
        error/auth:
          value:
            status: "010"
            message: 등록되지 않은 키입니다.
        error/invalid-request:
          value:
            status: "100"
            message: 필드의 부적절한 값입니다.

  - target: $.paths['/api/company.json'].get.responses.default.content['application/json']
    update:
      example:
        status: "100"
        message: 필드의 부적절한 값입니다.

